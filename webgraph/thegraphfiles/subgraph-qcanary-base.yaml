specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ERC21PQToken
    network: mainnet
    source:
      # ERC21PQToken deployed on Tenderly Base Fork (Chain ID: 8453)
      # Using 'mainnet' network label because Graph Node uses same Tenderly RPC
      address: '0x420366e5f35d53a2c0E3192f0C8fc6449509C875'
      abi: ERC21PQToken
      # Starting from recent block (adjust if contract was deployed earlier)
      startBlock: 23650000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
        - ZKTransfer
        - ZKProofFailed
        - ZKStats
      abis:
        - name: ERC21PQToken
          file: ./abiERC21PQToken.json
      eventHandlers:
        # Standard ERC20 Transfer event (baseline)
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        # Quantum-resistant ZK Transfer event (successful proofs)
        - event: ZKTransfer(indexed address,indexed address,uint256,uint256)
          handler: handleZKTransfer
        # Failed ZK proof event (quantum crack detection)
        - event: ZKProofFailed(indexed address,indexed address,uint256,string)
          handler: handleZKProofFailed
      file: ./src/mapping.ts
