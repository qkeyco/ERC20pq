specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ERC21PQToken
    network: mainnet
    source:
      # ERC21PQToken deployed on Tenderly (Chain ID: 73571)
      address: '0x9a1766f6cc8d02cc5c9b449958409a8f025b03bc'
      abi: ERC21PQToken
      # Starting from block 0 (Tenderly fork)
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
        - ZKTransfer
        - ZKProofFailed
        - ZKStats
      abis:
        - name: ERC21PQToken
          file: ./abiERC21PQToken.json
      eventHandlers:
        # Standard ERC20 Transfer event (baseline)
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        # Quantum-resistant ZK Transfer event (successful proofs)
        - event: ZKTransfer(indexed address,indexed address,uint256,uint256)
          handler: handleZKTransfer
      file: ./src/mapping.ts
