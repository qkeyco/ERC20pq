specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ERC21PQToken
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: ERC21PQToken
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Account
        - Transfer
        - ZKTransfer
        - HDCommitment
        - ZKGuardEnabled
      abis:
        - name: ERC21PQToken
          file: ./abis/ERC21PQToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: HDCommitmentBound(indexed address,bytes32)
          handler: handleHDCommitmentBound
        - event: ZKGuardEnabled(indexed address)
          handler: handleZKGuardEnabled
        - event: ZKTransfer(indexed address,indexed address,uint256,uint256)
          handler: handleZKTransfer
        - event: TransferBlocked(indexed address,indexed address,uint256,string)
          handler: handleTransferBlocked
      file: ./src/mapping.ts
